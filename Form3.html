<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>
    <h2>Feedback Form</h2>
    <form action="#" method="post">
        <label>Name:</label><br>
        <input type="text" name="name"><br><br>

        <label>Guess The Score</label>
        <select name="Runs">
            <option>200</option>
            <option>150</option>
            <option>100</option>
            <option>50+</option>
        </select><br><br>

        <label>Comments:</label>
        <textarea name="Comments" rows="5" cols="50"></textarea><br><br>

        <input type="submit" value="submit your Opinion">
    </form>
</body>
</html>
